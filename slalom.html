</style><script defer src="slalom.js"></script></head><body><main class="shell"><header><span class="brand">Sophi<i>Kart</i></span><a class="course-link" href="index.html">Back to drive</a></header><h1>Slalom</h1><p>Pass five cones on their marked sides. Steer with ← and →. Hold Space to brake.</p><div class="course"><canvas tabindex="0" aria-label="Slalom course. Green arrows show which side of each cone to pass."></canvas></div><div class="panel"><div id="stats" class="stats"></div><button class="primary" id="start">Start run</button></div><div class="inputs"><button data-input="left" aria-label="Steer left">←</button><button data-input="right" aria-label="Steer right">→</button><button data-input="brake">Hold brake</button></div><p id="message" role="status"></p></main></body></html>
